<!DOCTYPE html><html><head>
    <title>Cooperative Writing Game</title>
    <style>body {
  background: #f5f5f5;
  max-width: 800px;
  margin: 0 auto;
  padding: 20px;
  font-family: Arial, sans-serif;
}

.phase {
  background: #fff;
  border-radius: 8px;
  margin: 20px 0;
  padding: 20px;
  display: none;
}

.active {
  display: block;
}

button {
  color: #fff;
  cursor: pointer;
  background: #4caf50;
  border: none;
  border-radius: 4px;
  margin: 10px 5px;
  padding: 10px 20px;
}

textarea {
  width: 100%;
  height: 150px;
  margin: 10px 0;
  padding: 10px;
}

.player-list {
  margin: 10px 0;
}

.player {
  background: #e9e9e9;
  border-radius: 3px;
  margin: 2px 0;
  padding: 5px;
}

.ready {
  background: #90ee90;
}
</style>
  </head>
  <body>
    <h1>📝 Cooperative Writing Game</h1>
    <div id="status">Connecting...</div>

    <!-- Lobby Phase -->
    <div id="lobbyPhase" class="phase">
      <h2>Lobby</h2>
      <div id="playerList" class="player-list"></div>
      <button id="readyBtn">I'm Ready!</button>
      <div id="waitingMessage" style="display: none">
        Waiting for <span id="neededPlayers">1</span> more player...
      </div>
    </div>

    <!-- Writing Phase -->
    <div id="writingPhase" class="phase">
      <h2>Writing Phase</h2>
      <div id="prompt"></div>
      <div id="timer">Time remaining: --:--</div>
      <textarea id="writingInput" placeholder="Write your contribution here..."></textarea>
      <button id="submitWritingBtn">Submit</button>
    </div>

    <!-- Review Phase -->
    <div id="reviewPhase" class="phase">
      <h2>Review Submissions</h2>
      <div id="submissionsList"></div>
    </div>

    <!-- Voting Phase -->
    <div id="votingPhase" class="phase">
      <h2>Vote for Best Submission</h2>
      <div id="votingOptions"></div>
    </div>

    <!-- Results Phase -->
    <div id="resultsPhase" class="phase">
      <h2>Round Results</h2>
      <div id="winnerDisplay"></div>
      <div id="currentStory"></div>
    </div>

    <script src="/client.34df32e0.js" type="module"></script>
  

</body></html>
