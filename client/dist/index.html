<!DOCTYPE html><html><head>
    <title>Cooperative Writing Game</title>
    <style>body {
  background: #f5f5f5;
  max-width: 800px;
  margin: 0 auto;
  padding: 20px;
  font-family: Arial, sans-serif;
}

#authSection {
  text-align: center;
  background: #fff;
  border-radius: 8px;
  margin: 20px 0;
  padding: 40px;
}

#authSection input {
  border: 1px solid #ddd;
  border-radius: 4px;
  width: 200px;
  margin: 10px;
  padding: 10px;
}

.hidden {
  display: none !important;
}

.phase {
  background: #fff;
  border-radius: 8px;
  margin: 20px 0;
  padding: 20px;
  display: none;
}

.active {
  display: block;
}

button {
  color: #fff;
  cursor: pointer;
  background: #4caf50;
  border: none;
  border-radius: 4px;
  margin: 10px 5px;
  padding: 10px 20px;
}

button:disabled {
  cursor: not-allowed;
  background: #ccc;
}

textarea {
  width: 100%;
  height: 150px;
  margin: 10px 0;
  padding: 10px;
}

.player-list {
  margin: 10px 0;
}

.player {
  background: #e9e9e9;
  border-radius: 3px;
  margin: 2px 0;
  padding: 5px;
}

.ready {
  background: #90ee90;
}

#userInfo {
  background: #e3f2fd;
  border-radius: 4px;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  padding: 10px;
  display: flex;
}

#signOutBtn {
  background: #f44336;
}
</style>
  </head>
  <body>
    <!-- AUTH SECTION (shown when NOT signed in) -->
    <div id="authSection">
      <h1>📝 Welcome to StoryCraft</h1>
      <p>Please sign in to start writing with others!</p>
      
      <div>
        <input type="text" id="playerName" placeholder="Your display name" maxlength="20">
        <input type="text" id="authToken" placeholder="Auth token" value="USER_DUMMY_TOKEN">
        <button id="signInBtn">Sign In &amp; Join Game</button>
      </div>
      
      <div id="authStatus" style="margin-top: 20px"></div>
    </div>

    <!-- GAME SECTION (shown when signed in) -->
    <div id="gameSection" class="hidden">
      <h1>📝 Cooperative Writing Game</h1>
      
      <div id="userInfo">
        <span>Welcome, <span id="userName">Player</span>!</span>
        <button id="signOutBtn">Sign Out</button>
      </div>
      
      <div id="status">Connecting...</div>

      <!-- Lobby Phase -->
      <div id="lobbyPhase" class="phase">
        <h2>Lobby</h2>
        <div id="playerList" class="player-list"></div>
        <button id="readyBtn">I'm Ready!</button>
        <div id="waitingMessage" style="display: none">
          Waiting for <span id="neededPlayers">1</span> more player...
        </div>
      </div>

      <!-- Writing Phase -->
      <div id="writingPhase" class="phase">
        <h2>Writing Phase</h2>
        <div id="prompt"></div>
        <div id="timer">Time remaining: --:--</div>
        <textarea id="writingInput" placeholder="Write your contribution here..."></textarea>
        <button id="submitWritingBtn">Submit</button>
      </div>

      <!-- Review Phase -->
      <div id="reviewPhase" class="phase">
        <h2>Review Submissions</h2>
        <div id="submissionsList"></div>
      </div>

      <!-- Voting Phase -->
      <div id="votingPhase" class="phase">
        <h2>Vote for Best Submission</h2>
        <div id="votingOptions"></div>
      </div>

      <!-- Results Phase -->
      <div id="resultsPhase" class="phase">
        <h2>Round Results</h2>
        <div id="winnerDisplay"></div>
        <div id="currentStory"></div>
      </div>
    </div>

    <script src="/client.34df32e0.js" type="module"></script>
  
</body></html>
